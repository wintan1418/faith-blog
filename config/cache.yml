default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    max_size: <%= 256.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

# Production uses the main connection pool (same database) so the cache
# doesn't hold its own set of connections on the shared server.
production:
  <<: *default
