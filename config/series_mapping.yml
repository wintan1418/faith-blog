# Series membership checked by hand against production (November 2026).
#
# Read by `bin/rails series:suggest`, which only prints what it would do
# unless run with APPLY=1. Post ids are production ids. Titles of the posts
# are never changed; the series gets the clean, plain-letter title below.
#
#   author:  the writer's username (every post must be theirs)
#   title:   the series title
#   parts:   post ids in part order, numbered 1, 2, 3 …; or a map of
#            post id => the writer's own part number, to keep gaps
#   exclude: post ids left out on purpose, with the reason (reported only)
#   create:  false to report the entry without creating anything
#   note:    printed with the entry

