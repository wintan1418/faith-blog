# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  site_health_check:
    class: SiteHealthCheckJob
    schedule: every 10 minutes

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  analytics_cleanup:
    class: AnalyticsCleanupJob
    schedule: every Sunday at 3am Africa/Lagos

  account_security_cleanup:
    class: AccountSecurityCleanupJob
    schedule: every day at 3:30am Africa/Lagos

  daily_summary:
    class: DailySummaryJob
    schedule: every day at 7am Africa/Lagos

  birthday_notifications:
    class: BirthdayNotificationsJob
    schedule: every day at 7am Africa/Lagos

  weekly_digest:
    class: WeeklyDigestFanoutJob
    schedule: every Sunday at 8am

  scheduled_post_publisher:
    class: ScheduledPostPublisherJob
    schedule: every 5 minutes

  updates_bots:
    class: BotsRefreshJob
    schedule: every hour at minute 7

  moderation_backlog_sweep:
    class: ModerationBacklogSweepJob
    schedule: every 5 minutes

  bible_quiz_warm_pool:
    class: BibleQuizWarmPoolJob
    schedule: every 6 hours

  # Admin → Search & indexing: sitemap to Google + IndexNow for the day's changes,
  # then the Search Console reports the page shows.
  search_indexing_nightly:
    class: SearchIndexingNightlyJob
    schedule: every day at 4am Africa/Lagos

  search_terms_refresh:
    class: SearchTermsRefreshJob
    schedule: every 6 hours

  search_console_refresh:
    class: SearchConsoleRefreshJob
    schedule: every day at 5am Africa/Lagos

  # "Have you read your Bible today?": each member's reminder at their own
  # local time (default 7:00), once a day, only if they haven't read yet.
  bible_reminders:
    class: BibleReminderJob
    schedule: every 15 minutes
