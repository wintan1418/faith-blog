<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Link preview for personal invite links (/join/username).
       Rendered to public/og/invite.jpg by bin/render-invite-og. -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2a21"/>
      <stop offset="55%" stop-color="#0b1712"/>
      <stop offset="100%" stop-color="#08110d"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="-5%" r="65%">
      <stop offset="0%" stop-color="rgba(52, 211, 153, 0.30)"/>
      <stop offset="100%" stop-color="rgba(52, 211, 153, 0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="95%" cy="105%" r="55%">
      <stop offset="0%" stop-color="rgba(212, 160, 60, 0.20)"/>
      <stop offset="100%" stop-color="rgba(212, 160, 60, 0)"/>
    </radialGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Brand -->
  <g transform="translate(88, 80)">
    <circle cx="32" cy="32" r="32" fill="url(#mark)"/>
    <path d="M14 39 C 22 27, 28 27, 32 39 C 36 51, 42 51, 50 39" fill="none" stroke="#042f1d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="44" cy="22" r="3.4" fill="#042f1d"/>
    <text x="84" y="44" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#f4faf7">Brethreign</text>
  </g>

  <!-- Invite pill -->
  <g transform="translate(88, 206)">
    <rect width="236" height="44" rx="22" fill="rgba(52, 211, 153, 0.14)" stroke="rgba(52, 211, 153, 0.45)"/>
    <text x="118" y="29" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#6ee7b7" letter-spacing="0.5">You're invited</text>
  </g>

  <text font-family="'Playfair Display', Georgia, serif" font-size="70" font-weight="700" fill="#f4faf7" letter-spacing="-1">
    <tspan x="88" y="338">Come join the</tspan>
    <tspan x="88" y="420">conversation.</tspan>
  </text>
  <text x="88" y="490" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="500" fill="#b9c8c1">A calm place to talk about work, life and faith.</text>
  <text x="88" y="560" font-family="ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="800" fill="#34d399" letter-spacing="0.5">brethreign.com</text>

  <!-- Conversation bubbles -->
  <g transform="translate(790, 150)">
    <rect x="0" y="0" width="300" height="118" rx="26" fill="#f5f1e8"/>
    <circle cx="44" cy="44" r="20" fill="#9fd8bf"/>
    <rect x="78" y="32" width="150" height="12" rx="6" fill="#1c211e" opacity="0.75"/>
    <rect x="78" y="54" width="96" height="10" rx="5" fill="#5e6862" opacity="0.5"/>
    <rect x="28" y="82" width="244" height="10" rx="5" fill="#5e6862" opacity="0.35"/>
    <path d="M40 118 L 30 142 L 66 118 Z" fill="#f5f1e8"/>

    <g transform="translate(70, 172)">
      <rect x="0" y="0" width="300" height="104" rx="26" fill="#0e5c43"/>
      <circle cx="256" cy="40" r="20" fill="#e9d9b4"/>
      <rect x="28" y="30" width="170" height="12" rx="6" fill="#f4faf7" opacity="0.9"/>
      <rect x="28" y="54" width="120" height="10" rx="5" fill="#f4faf7" opacity="0.55"/>
      <rect x="28" y="74" width="190" height="10" rx="5" fill="#f4faf7" opacity="0.4"/>
      <path d="M262 104 L 274 128 L 236 104 Z" fill="#0e5c43"/>
    </g>

    <g transform="translate(16, 330)">
      <rect x="0" y="0" width="190" height="64" rx="22" fill="#f5f1e8" opacity="0.92"/>
      <circle cx="40" cy="32" r="6" fill="#5e6862"/>
      <circle cx="62" cy="32" r="6" fill="#5e6862" opacity="0.7"/>
      <circle cx="84" cy="32" r="6" fill="#5e6862" opacity="0.45"/>
    </g>
  </g>
</svg>
